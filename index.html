<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#153d34">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Склад МБ">
  <meta name="description" content="Проверка Excel-заявок на закупку по остаткам склада Массивбург.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.deepseek.com; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Проверка заявки · Склад Массивбург</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <script src="./assets/xlsx.min.js" defer></script>
  <script src="./app.js" type="module"></script>
  <style>
    :root{color:#1b2d26;background:#f2f3ed;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--green:#153d34;--muted:#505e55;--line:#dbe1d7;--paper:#fff;--focus:#0e6a58;font-synthesis:none}
    *{box-sizing:border-box}
    body{margin:0;min-width:290px}
    [hidden]{display:none!important}
    button,input{font:inherit;color:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
    button:disabled{cursor:default;opacity:.55}
    .masthead{background:var(--green);color:white;padding:calc(env(safe-area-inset-top) + 14px) max(18px,env(safe-area-inset-right)) 15px max(18px,env(safe-area-inset-left))}
    .masthead-inner{max-width:740px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:.01em}
    .brand img{width:31px;height:31px;border-radius:8px;box-shadow:0 0 0 1px #78a491}
    .top-button{min-height:42px;background:transparent;border:1px solid #82a89a;color:#fff;border-radius:10px;padding:0 13px;font-weight:650}
    .top-button:focus-visible{outline-color:#fff}
    main{max-width:776px;margin:auto;padding:24px max(18px,env(safe-area-inset-left)) calc(32px + env(safe-area-inset-bottom))}
    h1,h2,h3,p{margin:0}
    h1{font-size:clamp(29px,7.6vw,39px);letter-spacing:-.035em;line-height:1.1;margin-bottom:18px}
    h2{font-size:21px;letter-spacing:-.025em;line-height:1.2}
    h3{font-size:16px;line-height:1.35;overflow-wrap:anywhere}
    .sources,.card,.history-row{background:var(--paper);border:1px solid var(--line);border-radius:14px}
    .pick{display:flex;position:relative;align-items:center;min-height:68px;gap:12px;padding:10px 12px}
    .pick+.pick,.ai{border-top:1px solid var(--line)}
    .pick:focus-within{outline:2px solid var(--focus);outline-offset:-2px;border-radius:11px}
    .mark{flex:0 0 36px;height:36px;display:grid;place-items:center;background:#e7eee6;border-radius:9px;color:#254f42;font-size:10px;font-weight:800;letter-spacing:.02em}
    .pick-copy{flex:1;min-width:0;display:grid;gap:3px}
    .pick-title{font-weight:700;font-size:15px}
    .file-name,.file-date,.muted,.detail,.small{color:var(--muted);font-size:13px;line-height:1.42;overflow-wrap:anywhere}
    .file-date{font-size:12px}
    .pick-action{display:grid;place-items:center;min-height:35px;background:#edf2e9;border-radius:8px;color:#2c5548;font-size:12px;font-weight:750;padding:0 9px}
    .pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
    .ai summary{min-height:47px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 13px;font-size:14px;font-weight:700;cursor:pointer;list-style:none}
    summary::-webkit-details-marker{display:none}
    .ai summary::after,.row-detail summary::after{content:'+';color:#356253;font-size:19px;font-weight:500}
    details[open]>summary::after{content:'−'}
    .ai>div{display:grid;gap:8px;padding:0 13px 13px}
    .key{width:100%;min-height:44px;background:#fbfcf9;border:1px solid #b9c9bd;border-radius:9px;padding:8px 10px;font-size:16px}
    .primary,.secondary{min-height:46px;border-radius:10px;padding:9px 14px;font-weight:750;border:1px solid transparent}
    .primary{background:var(--green);color:white;width:100%;margin-top:12px;font-size:16px}
    .secondary{background:#e7eee6;color:#234d3e;border-color:#d3ded3;font-size:13px}
    .notice{margin-top:9px;min-height:19px;color:var(--muted);font-size:13px;line-height:1.4;overflow-wrap:anywhere}
    .notice[data-error=true]{color:#a13b23}
    .results{margin-top:23px;scroll-margin:14px}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
    .results p.info{margin-block:7px;color:var(--muted);font-size:13px;line-height:1.4;overflow-wrap:anywhere}
    .range{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:13px 0 11px}
    .filter{border:1px solid #c8d4c9;background:#f7f9f5;border-radius:999px;min-height:42px;font-size:12px;font-weight:650;padding:0 9px;white-space:nowrap}
    .filter[aria-pressed=true]{background:var(--green);border-color:var(--green);color:white}
    .result-list,.history-list{display:grid;gap:9px}
    .card{overflow:hidden;position:relative;border-left:4px solid #6c9b84}
    .card[data-kind=partial]{border-left-color:#6384a3}
    .card[data-kind=buy]{border-left-color:#879086}
    .card[data-kind=manual]{border-left-color:#c38b42}
    .row-main{padding:12px 12px 9px}
    .row-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:5px}
    .badge{flex:0 0 auto;max-width:44%;background:#e5f0e8;color:#23573e;padding:4px 7px;border-radius:6px;font-weight:750;font-size:11px;line-height:1.25;text-align:center}
    .card[data-kind=partial] .badge{background:#e8eff7;color:#2c5471}
    .card[data-kind=buy] .badge{background:#eaece8;color:#45534a}
    .card[data-kind=manual] .badge{background:#fff0d8;color:#754a18}
    .amounts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:9px 0 0}
    .amounts div{background:#f0f4ee;border-radius:8px;padding:7px 8px;overflow-wrap:anywhere}
    .amounts span{display:block;font-size:11px;color:var(--muted);font-weight:650}
    .amounts strong{font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums}
    .place{margin-top:8px;font-size:13px;font-weight:650;line-height:1.4;color:#2c5548;overflow-wrap:anywhere}
    .row-detail{border-top:1px solid var(--line);padding:0 12px}
    .row-detail summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:43px;font-size:13px;font-weight:700;cursor:pointer}
    .row-detail .detail{padding-bottom:10px}
    .detail p+p{margin-top:6px}
    .detail strong{display:block;margin-top:9px;color:#1b2d26}
    .history-row{width:100%;text-align:left;padding:12px 13px;min-height:52px}
    .history-row strong{display:block;overflow-wrap:anywhere;margin-bottom:4px}
    .history-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
    .empty{padding:8px 0;font-size:14px;color:var(--muted)}
  </style>
</head>
<body>
  <header class="masthead"><div class="masthead-inner">
    <div class="brand"><img src="./assets/icon-192.png" alt="" width="31" height="31">Склад Массивбург</div>
    <button class="top-button" id="mode" type="button">Журнал</button>
  </div></header>
  <main>
    <section id="check-view" aria-labelledby="check-title">
      <h1 id="check-title">Проверка заявки</h1>
      <div class="sources">
        <label class="pick"><span class="mark" aria-hidden="true">XLSX</span><span class="pick-copy"><span class="pick-title" id="request-label">Заявка конструктора</span><span class="file-name" id="request-file">Выберите Excel из «Файлов»</span></span><span class="pick-action" id="request-action" aria-hidden="true">Выбрать</span><input id="request" aria-labelledby="request-label" type="file" accept=".xlsx,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel.sheet.macroEnabled.12"></label>
        <label class="pick"><span class="mark" aria-hidden="true">XLSX</span><span class="pick-copy"><span class="pick-title" id="purchases-label">Закупки</span><span class="file-name" id="purchases-file">Добавьте выгрузку Excel</span><span class="file-date" id="purchases-date" hidden></span></span><span class="pick-action" id="purchases-action" aria-hidden="true">Выбрать</span><input id="purchases" aria-labelledby="purchases-label" type="file" accept=".xlsx,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel.sheet.macroEnabled.12"></label>
        <label class="pick"><span class="mark" aria-hidden="true">JSON</span><span class="pick-copy"><span class="pick-title" id="registry-label">Реестр сверки склада</span><span class="file-name" id="registry-file">Добавьте выгрузку реестра</span><span class="file-date" id="registry-date" hidden></span></span><span class="pick-action" id="registry-action" aria-hidden="true">Выбрать</span><input id="registry" aria-labelledby="registry-label" type="file" accept=".json,application/json"></label>
        <details class="ai"><summary>DeepSeek</summary><div><label for="key" class="small">Ключ API для спорных совпадений</label><input class="key" type="password" id="key" autocomplete="off" autocorrect="off" spellcheck="false"><p class="small">Ключ действует до перезагрузки. В DeepSeek отправляются описания и артикулы кандидатов по спорным строкам.</p></div></details>
      </div>
      <button class="primary" type="button" id="run" disabled>Проверить заявку</button>
      <p class="notice" id="status" role="status" aria-live="polite"></p>
      <section class="results" id="results" tabindex="-1" hidden></section>
    </section>
    <section id="history-view" aria-labelledby="history-title" hidden>
      <h1 id="history-title">Журнал проверок</h1>
      <div class="history-actions"><span class="small">Хранится на этом устройстве</span><button class="secondary" id="history-export" type="button" disabled>Сохранить JSON</button></div>
      <div id="history-list" class="history-list"></div>
    </section>
  </main>
</body>
</html>
